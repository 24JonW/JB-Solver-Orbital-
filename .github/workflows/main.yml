name: JBSolver CI

on:
  push:
    branches: 
      - "**"
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        # Point the cache to the frontend folder's lockfile
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Frontend dependencies
      # This forces the command to run inside the frontend folder      
      run: npm install
      working-directory: ./frontend

    - name: Run Frontend automated tests
      run: npx vitest run
      working-directory: ./frontend
  
  backend-test:
    runs-on: ubuntu-latest 
    steps: 
    - name: Checkout repository code 
      uses: actions/checkout@v4 
    - name: set up Node.js 
      uses: actions/setup-node@v4
      with: 
        node-version: 24
    - name: Install Backend dependencies 
      run: npm install 
    - name: Run Backend automated tests 
      run: npm test 
      working-directory: ./backend


