name: JBSolver CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        # Point the cache to the frontend folder's lockfile
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Frontend dependencies
      # This forces the command to run inside the frontend folder      
      run: npm ci
      working-directory: ./frontend

    - name: Run Frontend automated tests
      run: npm test
      working-directory: ./frontend