name: JBSolver CI

# Trigger the workflow on pushes or pull requests to your main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Matches modern Vite/React environments
        cache: 'npm'     # Speeds up future runs by caching dependencies

    - name: Install dependencies
      run: npm ci        # Ensures a clean, exact install from your package-lock.json

    - name: Run automated tests
      run: npm test      # Executes your project's test suite
